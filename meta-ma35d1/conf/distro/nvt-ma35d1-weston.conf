# Nuvoton DISTRO for the GC520 2D / Weston-Wayland graphical backend.
#
# Stack: DRM/KMS + libetna2d (GC520 2D HAL via libdrm_etnaviv) ->
# qt5-etnaviv2d-qpa (Qt5 QPA plugin) -> Weston (drm-backend,
# --use-pixman, kiosk-shell/ivi-shell) -> nu-hmi-controller (ivi-shell
# layer manager) + GStreamer waylandsink.
include conf/distro/include/nvt-base.inc
DISTRO = "nvt-ma35d1-weston"
M4_OPJCOPY = "${RECIPE_SYSROOT_NATIVE}${datadir}/gcc-arm-none-eabi/arm-none-eabi/bin/objcopy"

# Required so qt5-etnaviv2d-qpa can find libdrm's headers
PACKAGECONFIG:append:pn-qtbase = " kms"

# wayland: Weston + Qt Wayland/EGL support.
# opengl: provides Mesa's GBM/EGL so Weston's drm-backend can import
#   client dmabufs for KMS scanout.
# gc520-kms: shared marker consumed by qt5-env.bbappend
DISTRO_FEATURES:append = " wayland opengl pam gc520-kms"

IMAGE_INSTALL:append = " \
    weston weston-init weston-examples \
    libdrm libdrm-tests \
    mesa \
    libetna2d \
    qt5-etnaviv2d-qpa \
    nu-hmi-controller \
    gstreamer1.0-plugins-bad \
    "
