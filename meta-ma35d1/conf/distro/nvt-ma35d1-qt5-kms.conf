# Nuvoton DISTRO for the GC520 2D stack running pure Qt5, no Weston.
#
# Stack: DRM/KMS + libetna2d (GC520 2D HAL via libdrm_etnaviv) ->
# qt5-etnaviv2d-qpa (Qt5 QPA plugin, direct-KMS mode - the plugin
# takes DRM master itself and reads input via libinput).
# No compositor, a single Qt app owns the display outright.
include conf/distro/include/nvt-base.inc
DISTRO = "nvt-ma35d1-qt5-kms"
M4_OPJCOPY = "${RECIPE_SYSROOT_NATIVE}${datadir}/gcc-arm-none-eabi/arm-none-eabi/bin/objcopy"

# kms: required so qt5-etnaviv2d-qpa can find libdrm's headers
# libinput: required for qt5-etnaviv2d-qpa direct-KMS mode input handling.
PACKAGECONFIG:append:pn-qtbase = " kms libinput"

# gc520-kms: shared marker consumed by qt5-env.bbappend
DISTRO_FEATURES:append = " pam gc520-kms"

IMAGE_INSTALL:append = " \
    libdrm libdrm-tests \
    libetna2d \
    qt5-etnaviv2d-qpa \
    "
